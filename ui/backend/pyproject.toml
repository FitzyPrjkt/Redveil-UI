[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redveil-api"
version = "0.1.0"
description = "FastAPI backend for the redveil security scanner UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redveil @ file:///workspace/projects/Redveil",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["redveil_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[project]
name = "redveil-ui"
version = "0.1.2"
description = "Self-hosted web dashboard for the redveil security scanner"
readme = "PYPI_README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fitzydev" }]
keywords = ["security", "scanner", "dashboard"]

dependencies = [
  "redveil>=1.9.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.scripts]
redveil-ui = "redveil_ui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redveil_ui"]

[tool.hatch.build.targets.wheel.force-include]
"ui/frontend/out" = "redveil_ui/web"

[tool.hatch.build.targets.sdist]
# The redveil-ui package only needs the `redveil_ui/` Python source +
# the built Next.js `out/` (the SPA shell, force-included into the wheel
# above). Everything else in this repo is the underlying redveil
# library source, library tests, dev artifacts, or local-only config
# that should never be shipped.
exclude = [
    # Next.js build caches (NOT shipped — 671MB node_modules + 86MB .next)
    "ui/frontend/node_modules",
    "ui/frontend/.next",
    "ui/frontend/test-results",
    "ui/frontend/.turbo",
    "ui/frontend/.swc",
    # The redveil library source (installed from PyPI as a dep)
    "src",
    # The redveil library's tests (run in redveil's CI, not here)
    "tests",
    "test-results",
    # Local dev/test artifacts
    "data",
    "docs",
    "examples",
    "reports",
    # Design source: AGENTS.md/CLAUDE.md/PSD mockups — not shipped.
    # Exception: PYPI-shots/ is shipped because the published README
    # references these PNGs via raw.githubusercontent.com URLs.
    "Mockup-Redveil/AGENTS.md",
    "Mockup-Redveil/CLAUDE.md",
    "Mockup-Redveil/PSD",
    "Mockup-Redveil/Reference",
    # Claude / AI session state
    ".claude",
    ".remember",
    # CI / IDE / VCS metadata
    ".github",
    ".git",
    ".gitignore",
    ".vscode",
    ".idea",
    # Build artifacts
    "build",
    "dist",
    "*.egg-info",
    # Python bytecode
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    # OS
    ".DS_Store",
    "Thumbs.db",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"